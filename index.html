<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="./style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<section>
			<div class="container hero__container">
				<div class="hero__img">
					<img src="./istockphoto-499022574-612x612.jpg" alt="" />
				</div>
				<div class="hero">
					<div class="hero__text">
						<h1 class="hero__text-title">CAPTURE THE MOMENT</h1>
						<span class="hero__text-subtitle">
							Фотограф, який перетворює моменти на історії
						</span>
						<p class="hero__text-p">
							Портрети, love story, події та lifestyle-зйомки.Зберігаю справжні
							емоції, атмосферу й моменти, до яких хочеться повертатися.
						</p>
					</div>

					<div class="hero__button">
						<button class="hero__button-1">Переглянути портфоліо →</button>
						<button class="hero__button-2">Замовити зйомку →</button>
					</div>
					<div class="hero__list">
						<span><b>50+</b> зйомок</span>
						<span><b>4+</b> роки досвіду</span>
						<span><b>100%</b> живих емоцій</span>
					</div>
				</div>
			</div>
		</section>
